services:
  - type: web
    name: demostracion-qr-mongodb
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: catalogo_qr
      - key: SECRET_KEY
        generateValue: true
