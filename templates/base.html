<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Laboratorio QR{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header class="barra">
        <a class="marca" href="{{ url_for('inicio') }}">
            <span class="marca-icono">QR</span>
            <span>Laboratorio QR</span>
        </a>
        <nav>
            <a href="{{ url_for('inicio') }}">Catálogo</a>
            <a class="boton boton-claro" href="{{ url_for('nuevo_producto') }}">Nuevo registro</a>
        </nav>
    </header>

    <main class="contenedor">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="aviso {{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        {% endwith %}
        {% block contenido %}{% endblock %}
    </main>

    <footer>
        Ejemplo educativo - Flask, MongoDB Atlas y fichas mediante QR
    </footer>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
